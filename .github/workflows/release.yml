name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check release version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test and build
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleRelease lintDebug

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.GOVERNOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GOVERNOR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GOVERNOR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOVERNOR_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/governor-release.p12"
          trap 'rm -f "$keystore"' EXIT
          version="${GITHUB_REF_NAME#v}"
          artifact="governor-${version}.apk"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$artifact" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$apksigner" verify --verbose --print-certs "$artifact"
          certificate="$("$apksigner" verify --print-certs "$artifact" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$certificate" = "01a2c6db80ec450386bb45ffc073ad196e9b84cc9a467db7e9752add1f56d966"

          sha256sum "$artifact" > "$artifact.sha256"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
              --verify-tag \
              --title "Governor ${GITHUB_REF_NAME#v}" \
              --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
              --verify-tag \
              --title "Governor ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
