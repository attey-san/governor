name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Test, build, and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug
